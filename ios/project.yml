name: DataSharing
options:
  bundleIdPrefix: com.zinu.datasharing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QUVRH6RH45
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  DataSharing:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Assets.xcassets
    dependencies:
      - target: DataSharingControl
      - target: DataSharingTunnel
    # Declare capabilities as enabled so automatic signing registers them and
    # adds them to the provisioning profile.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.NetworkExtensions.iOS:
          enabled: 1
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Data Sharing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: DataSharing.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zinu.datasharing
        # Required to create and start the VPN configuration for the tunnel.
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zinu.datasharing.ios
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Control Center toggle (iOS 18+). Embedded in the app; on iOS 17 the
  # extension simply never loads.
  DataSharingControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ControlWidget
      - Shared
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    info:
      path: ControlWidget/Info.plist
      properties:
        CFBundleDisplayName: Data Sharing Control
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DataSharingControl.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zinu.datasharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zinu.datasharing.ios.control
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true

  # Packet tunnel extension that hosts the SOCKS5 server, so the proxy keeps
  # running with the app closed and the screen locked (see
  # PacketTunnelProvider). Needs a paid developer account: free provisioning
  # cannot grant the Network Extension entitlement.
  DataSharingTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - path: Shared/SharedState.swift
      - path: Shared/TunnelSnapshot.swift
      - path: Sources/UsageStore.swift
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.NetworkExtensions.iOS:
          enabled: 1
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Data Sharing Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: DataSharingTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zinu.datasharing
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zinu.datasharing.ios.tunnel
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
