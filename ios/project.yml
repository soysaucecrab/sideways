name: DataSharing
options:
  bundleIdPrefix: com.zinu.datasharing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  DataSharing:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Assets.xcassets
    dependencies:
      - target: DataSharingControl
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Data Sharing
        # Required so canOpenURL can detect AltStore / SideStore for refresh.
        LSApplicationQueriesSchemes:
          - altstore
          - sidestore
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: DataSharing.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zinu.datasharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zinu.datasharing.ios
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Control Center toggle (iOS 18+). Embedded in the app; on iOS 17 the
  # extension simply never loads.
  DataSharingControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ControlWidget
      - Shared
    info:
      path: ControlWidget/Info.plist
      properties:
        CFBundleDisplayName: Data Sharing Control
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DataSharingControl.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zinu.datasharing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zinu.datasharing.ios.control
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
